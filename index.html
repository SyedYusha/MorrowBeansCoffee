<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuddle Cup Cafe | Test Your Taste</title>
    <link rel="stylesheet" href="./CSS/style.cssgit" />
    <link rel="shortcut icon" href="./assets/coffee.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- header start -->
    <header class="header">
      <a href="#">
        <img
          src="./assets/coffee.png"
          class="logo-nav"
          alt="Logo.img"
          width="75px"
        />
      </a>
      <nav class="navbar">
        <ul class="nav_menu">
          <li><a href="#Home">Home</a></li>
          <li><a href="#About">About</a></li>
          <li><a href="#Products">Products</a></li>
          <li><a href="#reveiw">Reveiw</a></li>
          <li><a href="#Contact">Contact US</a></li>
        </ul>
        <!-- <ul class="res_nav_menu">
          <li><a href="#Home">Home</a></li>
          <li><a href="#About">About</a></li>
          <li><a href="#Products">Products</a></li>
          <li><a href="#reveiw">Reveiw</a></li>
          <li><a href="#Contact">Contact US</a></li>
        </ul> -->
      </nav>
      <div class="icons">
        <div class="fa-solid fa-magnifying-glass" style="top: 0px; right: 55px" id="search-btn"></div>
        <div class="fa-solid fa-cart-shopping" id="cart-btn"></div>
        <div class="fa-solid fa-bars" id="bar-btn"></div>
      </div>
      <div class="search-form">
        <input type="search" id="search-box" placeholder="Search Here..." />
        <label for="search-box" class="fa-solid fa-magnifying-glass"></label>
      </div>
      <div class="cart-items-container">
        <div class="cart-items">
          <span class="fa-solid fa-circle-xmark"></span>
          <img src="./assets/image_01.jpg" alt="image_01" width="150px" />
          <div class="content">
            <h3>Cart item 01</h3>
            <h4>Robusta</h4>
            <div class="price">$15.99/-</div>
          </div>
        </div>
        <div class="cart-items">
          <span class="fa-solid fa-circle-xmark"></span>
          <img src="./assets/image_02.avif" alt="image_01" width="150px" />
          <div class="content">
            <h3>Cart item 02</h3>
            <h4>Arabica</h4>
            <div class="price">$15.99/-</div>
          </div>
        </div>
        <div class="cart-items">
          <span class="fa-solid fa-circle-xmark"></span>
          <img src="./assets/image_06.jpg" alt="image_01" width="150px" />
          <div class="content">
            <h3>Cart item 03</h3>
            <h4>Liberica</h4>
            <div class="price">$15.99/-</div>
          </div>
        </div>
        <div class="cart-items">
          <span class="fa-solid fa-circle-xmark"></span>
          <img src="./assets/image_05.jpg" alt="image_01" width="150px" />
          <div class="content">
            <h3>Cart item 04</h3>
            <h4>Excelsa</h4>
            <div class="price">$15.99/-</div>
          </div>
        </div>
        <button class="cart-btn">
          <a href="#">Checkout Now</a><i class="fa-solid fa-credit-card"></i>
        </button>
      </div>
    </header>
    <!-- header End -->
  </body>
</html>
